<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Placement Preparation Tracker</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar will be injected here -->
        <div id="sidebar-container"></div>
        
        <main class="main-content">
            <header class="page-header">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="mobile-menu-btn" aria-label="Toggle Menu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <h1 class="page-title">Dashboard</h1>
                </div>
            </header>
            
            <div class="dashboard-grid animate-fade-in">
                <!-- Summary Cards -->
                <div class="card summary-card gradient-blue">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </div>
                    <div class="card-content">
                        <h3>Problems Solved</h3>
                        <p class="stat-value" id="stat-problems">0</p>
                    </div>
                </div>
                
                <div class="card summary-card gradient-purple">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    </div>
                    <div class="card-content">
                        <h3>Today's Goals</h3>
                        <p class="stat-value" id="stat-goals">0/0</p>
                    </div>
                </div>
                
                <div class="card summary-card gradient-green">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </div>
                    <div class="card-content">
                        <h3>Mock Interviews</h3>
                        <p class="stat-value" id="stat-interviews">0</p>
                    </div>
                </div>
                
                <div class="card summary-card gradient-orange">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    </div>
                    <div class="card-content">
                        <h3>Study Streak</h3>
                        <p class="stat-value" id="stat-streak">0 Days</p>
                    </div>
                </div>
            </div>
            
            <div class="dashboard-sections animate-fade-in" style="animation-delay: 0.1s;">
                <div class="card">
                    <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem;">Recent Problems</h2>
                    <div id="recent-problems" class="table-container">
                        <!-- Populated by JS -->
                    </div>
                    <div style="margin-top: 1rem; text-align: right;">
                        <a href="./pages/problems.html" class="btn btn-primary">View All</a>
                    </div>
                </div>
                
                <div class="card">
                    <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem;">Upcoming Goals</h2>
                    <div id="upcoming-goals">
                        <!-- Populated by JS -->
                    </div>
                    <div style="margin-top: 1rem; text-align: right;">
                        <a href="./pages/goals.html" class="btn btn-primary">View All</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="./js/store.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/dashboard.js"></script>
</body>
</html>
