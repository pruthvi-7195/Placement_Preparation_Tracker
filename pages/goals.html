<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Goals | Placement Preparation Tracker</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/goals.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <main class="main-content">
            <header class="page-header">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="mobile-menu-btn" aria-label="Toggle Menu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <h1 class="page-title">Daily Goals Tracker</h1>
                </div>
                <button class="btn btn-primary" id="add-goal-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Goal
                </button>
            </header>
            
            <div class="goals-grid">
                <!-- Pending Goals -->
                <div class="card animate-fade-in">
                    <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        Pending Goals
                    </h2>
                    <div id="pending-goals-container" class="goals-list">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Completed Goals -->
                <div class="card animate-fade-in" style="animation-delay: 0.1s;">
                    <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        Completed Goals
                    </h2>
                    <div id="completed-goals-container" class="goals-list">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Goal Modal -->
    <div class="modal-overlay" id="goal-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Add Daily Goal</h2>
                <button class="close-modal" id="close-modal-btn">&times;</button>
            </div>
            <form id="goal-form">
                <div class="form-group">
                    <label class="form-label" for="goal-title">Goal Title *</label>
                    <input type="text" class="form-control" id="goal-title" required placeholder="e.g. Solve 5 DSA problems">
                </div>
                <div class="form-group">
                    <label class="form-label" for="goal-deadline">Deadline *</label>
                    <input type="date" class="form-control" id="goal-deadline" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="goal-priority">Priority *</label>
                    <select class="form-control" id="goal-priority" required>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Goal</button>
            </form>
        </div>
    </div>

    <script src="../js/store.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/goals.js"></script>
</body>
</html>
